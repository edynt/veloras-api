basePath: /api/v1
definitions:
  github_com_edynnt_veloras-api_internal_auth_controller_dto.ChangePasswordReq:
    properties:
      confirm_password:
        minLength: 6
        type: string
      current_password:
        minLength: 6
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.ForgotPasswordReq:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.PermissionReq:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.RefreshTokenRes:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.ResetPasswordReq:
    properties:
      confirm_password:
        minLength: 6
        type: string
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.RoleReq:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.UserLoginReq:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  github_com_edynnt_veloras-api_internal_auth_controller_dto.UserRegisterReq:
    properties:
      address:
        type: string
      country:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      language:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_user_controller_dto.UpdateUserProfileRequest:
    properties:
      first_name:
        maxLength: 50
        minLength: 1
        type: string
      language:
        enum:
        - en
        - vi
        type: string
      last_name:
        maxLength: 50
        minLength: 1
        type: string
      phone_number:
        maxLength: 20
        minLength: 10
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  github_com_edynnt_veloras-api_internal_user_controller_dto.UserListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UserResponse'
        type: array
    type: object
  github_com_edynnt_veloras-api_internal_user_controller_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_verified:
        type: boolean
      language:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_edynnt_veloras-api_pkg_response.APIError:
    properties:
      err: {}
      errorFlag:
        type: boolean
      message:
        type: string
      statusCode:
        type: integer
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a server for a Go Drunk Backend API, demonstrating DDD principles.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Drunk Backend API by DDD
  version: "1.0"
paths:
  /admin/cron/cleanup:
    post:
      consumes:
      - application/json
      description: Manually trigger cleanup of expired data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Run manual cleanup
      tags:
      - admin
  /admin/cron/jobs:
    get:
      consumes:
      - application/json
      description: Get information about all scheduled cron jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get scheduled cron jobs
      tags:
      - admin
  /admin/cron/log-cleanup:
    post:
      consumes:
      - application/json
      description: Manually trigger cleanup of old log files
      parameters:
      - description: 'Number of days to keep logs (default: 30)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Run manual log cleanup
      tags:
      - admin
  /admin/logs/cleanup:
    post:
      consumes:
      - application/json
      description: 'Remove log files older than specified days (default: 30)'
      parameters:
      - description: 'Number of days to keep logs (default: 30)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Cleanup old logs
      tags:
      - admin
  /admin/logs/content:
    get:
      consumes:
      - application/json
      description: Get content of a specific log file
      parameters:
      - description: Log filename
        in: query
        name: filename
        required: true
        type: string
      - description: 'Number of lines to return (default: 100)'
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get log content
      tags:
      - admin
  /admin/logs/files:
    get:
      consumes:
      - application/json
      description: Get list of available log files
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get log files
      tags:
      - admin
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the current user's password by providing current password
        and new password
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.ChangePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Unauthorized or current password incorrect
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset instructions to user's email
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.ForgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password credentials
      parameters:
      - description: User login request (email, password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.UserLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns authenticated user account information
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request format or validation errors
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Login failed due to invalid credentials
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the current user and invalidate their session
      produces:
      - application/json
      responses:
        "200":
          description: Returns logout success message
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access token and refresh token
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.RefreshTokenRes'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Refresh failed
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account with username, password, email, and other
        details
      parameters:
      - description: User registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.UserRegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns created account ID
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "409":
          description: Registration failed due to conflict
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using the token received via email
      parameters:
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or token
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Reset password with token
      tags:
      - Auth
  /auth/verify/{userId}/{code}:
    get:
      consumes:
      - application/json
      description: Verify a user's email address using the provided verification code
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Verification code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns verification status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or verification failed
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Verify user email
      tags:
      - Auth
  /permissions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available permissions in the system
      produces:
      - application/json
      responses:
        "200":
          description: Returns list of permissions
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Get all permissions
      tags:
      - Permissions
    post:
      consumes:
      - application/json
      description: Create a new permission with name and description
      parameters:
      - description: Permission creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.PermissionReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns created permission
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation errors
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Create a new permission
      tags:
      - Permissions
  /permissions/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a permission by ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Permission deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or permission not found
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Delete a permission
      tags:
      - Permissions
    put:
      consumes:
      - application/json
      description: Update a permission's name and description by ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.PermissionReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns updated permission
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation errors
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Update an existing permission
      tags:
      - Permissions
  /roles:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available roles in the system
      produces:
      - application/json
      responses:
        "200":
          description: Returns list of roles
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Get all roles
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Create a new role with name and description
      parameters:
      - description: Role creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.RoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns created role
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation errors
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Create a new role
      tags:
      - Roles
  /roles/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a role by ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or role not found
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Delete a role
      tags:
      - Roles
    get:
      consumes:
      - application/json
      description: Retrieve a specific role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns role details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or role not found
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Get a role by ID
      tags:
      - Roles
    put:
      consumes:
      - application/json
      description: Update a role's name and description by ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_auth_controller_dto.RoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns updated role
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation errors
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      summary: Update an existing role
      tags:
      - Roles
  /users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of all users
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns paginated list of users
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UserListResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - Users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns user information
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UserResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the profile information of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Returns current user information
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update the profile information of the currently authenticated user
      parameters:
      - description: Update profile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns updated user information
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_internal_user_controller_dto.UserResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_edynnt_veloras-api_pkg_response.APIError'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
swagger: "2.0"
